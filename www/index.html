<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1221" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Talat HHS | iPhone-proef</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div><span class="small-overline">TALAT HHS · MOBIELE PROEF</span><h1 id="screen-title">Vandaag</h1></div>
        <div class="avatar" aria-label="Proefapp">HHS</div>
      </header>
      <div class="demo-notice" role="note">PROEFVERSIE · voorbeeldtaken · geen Windows-sync</div>
      <main id="screen" aria-live="polite"></main>
      <nav class="tabbar" aria-label="Hoofdnavigatie">
        <button type="button" class="tab active" data-tab="today" aria-current="page"><span class="nav-icon">⌂</span><span>Vandaag</span></button>
        <button type="button" class="tab" data-tab="courses"><span class="nav-icon">▦</span><span>Vakken</span></button>
        <button type="button" class="tab" data-tab="memory"><span class="nav-icon">✧</span><span>Geheugen</span></button>
        <button type="button" class="tab" data-tab="about"><span class="nav-icon">⋯</span><span>Meer</span></button>
      </nav>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
